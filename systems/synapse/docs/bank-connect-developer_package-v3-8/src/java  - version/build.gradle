task commonLibrary(type: GradleBuild) {
	println 'TAA******************************* Building commonLibrary'
    buildFile='Common Library/build.gradle'
    tasks = ['clean', 'build']
    
    copy {
        from ('Common Library/build/libs/')  
        include 'common-library*.jar/'
        into 'lib'
    }    
}

task release(type: Zip) {
	println 'TAA******************************* Running the task RELEASE'
    archiveName='BankConnect-' + version + '.zip'
    from ('Common Library')  {
        include '**'
        exclude 'build.gradle'
    	exclude '**/.gradle'
        exclude '**/*.jazz*'
        exclude '**/build/'
        exclude '**/bin'               
        into 'Common Library'
        rename('build-provided.gradle', 'build.gradle')
    }
    from ('Common Library/build/libs/')  {
        include 'common-library*.jar/'
        into 'lib'
    }

//	from ('SoapUI Test') {
     // include '**'
     // exclude 'build.gradle'
     // exclude '**/*.jazz*'
     // exclude '**/build'
     // exclude '**/bin'
     // exclude '**/lib/SoapUI Pro 5.1.2/**'
     // exclude '**/.gradle'
     // into 'SoapUI Test'
     // rename('build-provided.gradle', 'build.gradle')
// }
    from ('resources')  {
        include '**'
        exclude '**/*.jazz*'
        exclude '**/BankConnect bankcertificate udloeb 20200506.pem'
        exclude '**/BankConnect Issuer CA udloeb 20250506.pem'
        exclude '**/BECService-prod.pem'
        exclude '**/BECIssuerService-prod.pem'
        exclude '**/BECIssuerCustomer-prod.pem'
        into 'resources'
    }
    from ('dist')  {
        include '**'
        exclude '**/*.jazz*'
        into 'dist'
    }
    from ('src')  {
        include '**'
        exclude '**/*.jazz*'
        into 'src'
    }
    from ('test')  {
        include '**'
        exclude '**/*.jazz*'
		filter(ReplaceTokens, tokens: ['version': version])
        into 'test'
    }
    from ('docs')  {
        include '**'
        exclude 'Test-Guide for testers.docx'
        exclude 'Paytypes XML.zip'
		exclude 'Rules for Pain 001 & 002.Zip'
        exclude '**/*.jazz*'
        exclude '**/*pdfdocs'
        into 'docs'
    }
    from ('.')  {
		include 'ContentDeveloperPackage.docx'
        into '/'
	}
    from ('lib')  {
        include '**'
		exclude 'common-library*.jar/'
        exclude '**/*.jazz*'
        into 'lib'
    }
    from ('WebContent')  {
        include '**'
        exclude '**/*.jazz*'
		filter(ReplaceTokens, tokens: ['version': version])
        into 'WebContent'
    }
    from ('.')  {
//      include 'verify.sh'
//      include 'jetty-runner.jar'
        include 'build-provided.gradle'
        include 'settings.gradle'
        include 'gradle-provided.properties'
        include 'endpoints.txt'        
        into '/'
		filter(ReplaceTokens, tokens: ['version': version])
		filter(ReplaceTokens, tokens: ['endpoint': endpoint])
        rename('build-provided.gradle', 'build.gradle')                
		rename('gradle-provided.properties', 'gradle.properties')
    }    
    from ('scripts')  {
        include '*.bat'
        into 'bin'
    }
    from ('.')  {
        include 'bc.*'
        include 'jetty-runner.jar'
        into 'bin'
    }    
    from ('dotnet')  {
    	include '**'
    	into 'dotnetdemo'
    }	
}	

task pack_test_CA(type: Zip) {
    archiveName='BankConnect_test_CA.zip'
    
	from ('resources/security')  {
		include 'bd-prod-ca-ssl.pem'
	}
	
	from ('resources/security/BD')  {
		include 'BD BankConnect CA-test .pem'
	}
	
	from ('resources/security/BEC')  {
		include 'BEC BankConnect CA-test.pem'
	}
	
	from ('resources/security/SDC')  {
		include 'SDC BankConnect CA-test.pem'
	}
}

task pack_prod_CA(type: Zip) {
    archiveName='BankConnect_prod_CA.zip'
    
	from ('resources/security')  {
		include 'bd-prod-ca-ssl.pem'
	}
	
	from ('resources/security/BD')  {
		include 'BD Primary CA.pem'
	}
	
	from ('resources/security/BEC')  {
		include 'BEC Root CA.pem'
	}
	
	from ('resources/security/SDC')  {
		include 'SDC Bank Connect Primary CA.pem'
	}
}

task pack_CA(type: GradleBuild) {
    tasks = ['pack_test_CA','pack_prod_CA']
}

tasks.withType(Javadoc) {
    options.memberLevel = JavadocMemberLevel.PRIVATE
}

if (JavaVersion.current().isJava8Compatible()) {
    tasks.withType(Javadoc) {
        // disable the super-strict doclint tool in Java 8
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

compileJava.dependsOn(wsdl2java)
war.dependsOn(compileJava, jar, commonLibrary, docs)
release.dependsOn(clean, war)
