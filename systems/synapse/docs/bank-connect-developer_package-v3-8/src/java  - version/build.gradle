import org.apache.tools.ant.filters.ReplaceTokens
apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'jetty'
apply plugin: "jacoco"
apply plugin: 'base'
apply plugin: 'war'

repositories {
		maven {
		  url "http://b5217s01.d101p.bdpnet.dk:9081/artifactory/BD-repository-T"
		}
}

sourceCompatibility = 1.6
targetCompatibility = 1.6
jettyRunWar.httpPort=8080
jettyRunWar.contextPath="bankconnect"

// Version configuration
def majorversion=System.properties['majorversion']
def minorversion=System.properties['minorversion']
version = majorversion + '.' + minorversion
def endpoint=System.properties['endpoint']

def generatedWs ="$buildDir/generated"
// To run SoapUI test from java - fix the path to your local installation
def soapuiDirectory="/udvikler/sooapui-5.1.1"  

def defaultEncoding = 'UTF-8'

compileJava {
    options.encoding = defaultEncoding
}

compileTestJava {
    options.encoding = defaultEncoding
}

// New configuration for CXF dependencies.
configurations { cxf }

/*ext {
    // CXF version.
    cxfVersion = '3.0.2'
    cxfArtifacts = [
        'cxf-tools-wsdlto-core',
        'cxf-tools-wsdlto-frontend-jaxws', 
        'cxf-tools-wsdlto-databinding-jaxb' 
    ] 
}
*/
dependencies {
    // Assign CXF dependencies to configuration.
    /*cxfArtifacts.each { artifact ->
       cxf "org.apache.cxf:$artifact:$cxfVersion"
    }*/
	cxf fileTree(dir:'lib', include:'*.jar')
}

clean {
    delete "dist"
	delete fileTree('lib') {
        include 'common-library*.jar'
    }
}

war {
	println 'TAA******************************* Running the task WAR'
	archiveName='bankconnect.war'
  	destinationDir=file("dist/target")
  	rootSpec.exclude("**/geronimo-servlet*.jar")
  	rootSpec.exclude("**/jetty*.jar")
  	rootSpec.exclude("soapui/**/*")
  	from ('WebContent')
	{
		filter(ReplaceTokens, tokens: ['version': version])
	}
  	from ('docs')  {
	  	include '**'
	  	exclude '**jazz*'
	  	exclude '**/*pdfdocs'
	  	exclude 'Test-Guide for testers.docx'
	  	into 'docs'
   }
   from ('resources')  {
	  	include '**'
	  	into 'resources'
   }
   from ('test')  {
	  	include '**'
	  	exclude("**/*.jks")
	  	into '/WEB-INF/classes'
	  	
   }
   from ('build/docs/javadoc')  {
	  	include '**'
	  	into 'javadoc'
   }
   from ('build/reports/tests')  {
	  	include '**'
	  	into 'docs/test'
   }
//   from ('Content Generator/build/docs/javadoc')  {
//	  	include '**'
//  	into 'javadoc/cg'
// }
//   from ('Content Generator/build/reports/tests')  {
//  	include '**'
//		into 'docs/cg/test'
// }
//   from ('Content Generator/build/distributions')  {
//  	include 'cg-' + version + '.zip'
//		into 'cg/'
//}
   from ('Windows Client example/BankConnectClient')  {
	  	include '**'
	  	into 'Windows Client example'
   }
}
    
// Custom task to generate Java classes from WSDL.
task wsdl2java(type: JavaExec) {	
	println 'TAA******************************* Running the task WSDL2JAVA'
	outputs.upToDateWhen { false }
    ext {
        wsdlFile = "resources/wsdl/bankconnect.wsdl"
        outputDir = file(generatedWs)
    }
	
    inputs.file file(wsdlFile)
    outputs.dir outputDir
    // Main Java class to invoke.
    main = 'org.apache.cxf.tools.wsdlto.WSDLToJava'
    // Set classpath to dependencies assigned
    // to the cxf configuration.
    classpath = configurations.cxf
    // Arguments to be passed to WSDLToJava.
    args '-d', outputDir
    args '-client'
//    args '-wsdlLocation', 'resources/wsdl/banconnect.wsdl'
    args '-verbose'
//    args '-xjc-npa'
    args '-validate'
    //args '-xjc-Xlocator'
    //args '-dex, 'false'
    args '-exsh','true'
	args '-frontend', 'jaxws21'
    args wsdlFile
}

jacoco {
    //http://www.gradle.org/docs/current/userguide/jacoco_plugin.html
    reportsDir = file("$buildDir/customJacocoReportDir")
}

jacocoTestReport {
    reports {
        xml.enabled false
        csv.enabled false
        html.destination "${buildDir}/jacocoHtml"
    }
}

jar {
    manifest {
        attributes 'Implementation-Title': 'BankConnect Quickstart', 'Implementation-Version': version 
    }

    archiveName='bankconnect.jar'
    destinationDir=file('dist/target')
}

sourceSets {
    main {
        java {
            srcDir 'src'
 			srcDir generatedWs          
 		}
        resources {
            srcDir 'src'
            srcDir 'src/resources'
        }
       }
    test {
    	java {
            srcDir 'test'
        }    
        resources {
            srcDir 'test'
            srcDir 'test/resources'
        }
    }
    
}

dependencies {
    testCompile group: 'junit', name: 'junit', version: '4.+'
    compile fileTree(dir: 'lib', include: '*.jar')  
    compile project('Common Library')
}

test {
    systemProperties 'property': 'value'
}

task runMockClient (type: JavaExec) {
	main='dk.bankconnect.client.BankConnectClient'
	classpath = sourceSets.main.runtimeClasspath
}

task integrationTest(type: Exec) {
	executable soapuiDirectory+"/bin/mockservicerunner.bat"
	// Run soapui integrationtests
	args "/udvikler/rational/rad85ws/nbp/BankConnect/test/soapui/BankConnect-Service.xml"  
}

task docs(type: GradleBuild) {
	tasks = ['test','javadoc']
}

task docsToPDF(type: GradleBuild) {
	buildFile='Document converter/build.gradle'
	tasks = ['docsToPDF']
}

