#org.apache.ws.security.crypto.provider=org.apache.ws.security.components.crypto.Merlin
org.apache.ws.security.crypto.provider=dk.bankconnect.security.BankConnectCrypto
org.apache.ws.security.crypto.merlin.keystore.type=jks
org.apache.ws.security.crypto.merlin.keystore.password=bankconnect
org.apache.ws.security.crypto.merlin.keystore.file=bankconnect.jks

dk.bankconnect.security.bankconnectcrypto.validatecertificate=false
dk.bankconnect.security.bankconnectcrypto.signing.certificate=bank connect-test
dk.bankconnect.security.bankconnectcrypto.private.key=bank connect-test
dk.bankconnect.security.bankconnectcrypto.decryption.certificate=erp-xyz

dk.bankconnect.server.force.wssecurity=false
dk.bankconnect.security.securityservice.encrypt=true
dk.bankconnect.security.securityservice.signing=true
dk.bankconnect.security.securityservice.trace=true

# Notice the values below needs to be in sync with the values in client.properties
dk.bankconnect.server.valid.activationcode=5647382910TGRFDE
dk.bankconnect.server.valid.functionidentification=112233445566778899
